name: 每日数据更新与部署

on:
  schedule:
    # 每 3 小时一次，固定在第 20 分钟（UTC 偶数×3 的小时点）。
    # 三点考虑：
    #  ① 避开整点：GitHub 官方说明「每小时开始前后为高负载时段，定时任务可能被延迟甚至跳过」。
    #     原先设在 UTC 00:17（紧邻整点）的配置连续多轮均未触发，见 README「案例四」。
    #  ② 一天 8 次互为兜底：单次被调度器跳过时，当天仍有其它机会更新。
    #  ③ 每 3 小时刷新一次，真实满足「每日自动更新」，也更贴近资讯类站点的新鲜度需求。
    - cron: "20 */3 * * *"   # 北京时间 08:20 / 11:20 / 14:20 / 17:20 / 20:20 / 23:20 / 02:20 / 05:20
  workflow_dispatch: {}   # 手动触发入口：Actions 页面 → Run workflow
  push:
    branches: [main]      # 代码变更时也重新部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 前端要调的 API 地址（仓库 Settings → Variables 配置，如 https://xxx.fly.dev）。
      # 未配置时 fetch.py 写空值、前端回落 localhost，本地开发不受影响。
      AI_API_BASE: ${{ vars.AI_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 采集 + 提交 + 推送合并为一步，带并发重试。
      # 原因：工作流 checkout 之后、push 之前，远端 main 可能被别的提交更新
      #（网页编辑、手动 push、其它 run），此时普通 push 会被拒（non-fast-forward），
      # 导致整次运行失败、数据未写入。2026-09-15 的 run 34927770343 就是这样失败的。
      # 处理方式：每次尝试都先回到远端最新，再重新跑一次 fetch.py（采集是幂等的），
      # 然后提交推送；最多重试 3 次，仍失败则让作业报错（不静默丢弃数据）。
      - name: 采集、提交并推送（含并发重试）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "===== 第 $attempt 次尝试 ====="
            git fetch origin main
            git reset --hard origin/main
            python fetch.py
            # 导出产物都要提交：data.json（前端数据）、stats.json（成本看板）、
            # config.js（线上 API 地址）—— 漏一个就会出现「页脚没数字 / 问答连不上」
            git add data/news.db web/data.json web/stats.json web/config.js
            if git diff --cached --quiet; then
              echo "本次无新增数据，无需提交"
              exit 0
            fi
            git commit -m "data: 自动更新 ${{ github.run_id }}"
            if git push origin HEAD:main; then
              echo "第 $attempt 次推送成功"
              exit 0
            fi
            echo "推送被拒（远端已更新），5 秒后重试"
            sleep 5
          done
          echo "::error::连续 3 次推送失败，请检查仓库是否被其它流程持续更新"
          exit 1

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # ============================================================
  # AI 分析 job（Week 1 新增）
  # 对新增新闻调用 DeepSeek 进行分类/摘要/验证
  # 使用 SQLite（news.db 已在 update 中更新并提交）
  # ============================================================
  analyze:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_API_BASE: ${{ vars.AI_API_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 确保拿到 update 推送后的最新代码

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 AI 分析
        run: |
          python analyze.py
          python fetch.py --export-only   # 重导出 data.json（含 AI 字段）

      - name: 提交分析结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          # 重新运行分析（以防 update 和 analyze 之间 main 被更新）
          python analyze.py
          python fetch.py --export-only
          git add data/news.db web/data.json web/stats.json web/config.js
          if git diff --cached --quiet; then
            echo "本次无新增分析结果"
            exit 0
          fi
          git commit -m "ai: 分析更新 ${{ github.run_id }}"
          git push origin HEAD:main || echo "::warning::分析结果推送失败（可能被并发更新覆盖）"

  # ============================================================
  # 质量门禁（Week 4）：单测覆盖率 + lint + 评测回归
  #
  # 成本控制：RAG 评测要跑 80 次 LLM 调用（约 ¥0.5-1），
  # 本工作流每 3 小时被 cron-job.org 触发一次，若每次都跑满，
  # 一天就是 ¥4-8、一个月上百元 —— 而这笔钱大部分花在「数据没变、代码也没变」的轮次上。
  # 因此按触发来源分流：
  #   push（代码变更）      → 跑完整评测，含 LLM 指标
  #   workflow_dispatch（定时数据更新）→ 只跑零成本的检索/分类评测
  # 两条路径都过同一份规则（evals/baseline.json），门禁强度只在「代码变更」时拉满。
  # ============================================================
  evals:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HF_ENDPOINT: https://hf-mirror.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: 运行单元测试（覆盖率熔断线 50%）
        run: |
          pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=50

      - name: 运行 Lint 检查
        # 规则集见仓库根目录 ruff.toml（含 E402 等逐条写明理由的忽略项）
        run: ruff check .

      - name: 运行评测回归门禁
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "代码变更触发 → 跑完整评测（含 LLM 指标）"
            python evals/run_all.py --gate-config evals/baseline.json --json
          else
            echo "定时数据更新 → 跳过 LLM 评测（省成本），仅跑检索/分类"
            python evals/run_all.py --gate-config evals/baseline.json --skip-llm --json
          fi

  deploy:
    needs: evals
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
