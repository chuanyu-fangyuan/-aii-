name: 每日数据更新与部署

on:
  schedule:
    # 每天两次：UTC 02:20 / 14:20，即北京时间 10:20 / 22:20。
    # 两点考虑：① 刻意避开整点——GitHub 官方说明「每小时开始前后为高负载时段，定时任务可能被延迟或跳过」，
    # 原先设在 UTC 00:17 的配置连续两轮均未触发（见 README「问题定位」）；
    # ② 每天两次互为兜底，单次被调度器跳过时当天仍有更新。
    - cron: "20 2,14 * * *"
  workflow_dispatch: {}   # 手动触发入口：Actions 页面 → Run workflow
  push:
    branches: [main]      # 代码变更时也重新部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集并导出数据
        run: python fetch.py

      - name: 提交更新结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: 自动更新 ${{ github.run_id }}"
          file_pattern: "data/news.db web/data.json"

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
