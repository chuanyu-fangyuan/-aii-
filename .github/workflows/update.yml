name: 每日数据更新与部署

on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）自动运行
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # 手动触发入口：Actions 页面 → Run workflow
  push:
    branches: [main]      # 代码变更时也重新部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集并导出数据
        run: python fetch.py

      - name: 提交更新结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: 自动更新 ${{ github.run_id }}"
          file_pattern: "data/news.db web/data.json"

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
