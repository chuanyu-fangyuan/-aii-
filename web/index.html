<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情报站 · 每日自动更新的 AI 资讯</title>
<meta name="description" content="聚合多个独立信息源的 AI 资讯，每日自动更新，支持搜索、筛选与关系图谱浏览。">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <h1 class="logo">AI <span>情报站</span></h1>
    <nav class="view-tabs" role="tablist" aria-label="视图切换">
      <button class="view-tab active" data-view="feed" role="tab" aria-selected="true">资讯流</button>
      <button class="view-tab" data-view="graph" role="tab" aria-selected="false">关系图谱</button>
      <button class="view-tab" data-view="ask" role="tab" aria-selected="false">AI 问答</button>
    </nav>
    <div class="update-badge" id="updateBadge" title="最近更新状态">
      <span class="dot" id="updateDot"></span><span id="updateText">载入中…</span>
    </div>
  </div>
  <div class="toolbar">
    <div class="date-tabs" role="group" aria-label="时间范围">
      <button class="date-tab active" data-range="today">今天</button>
      <button class="date-tab" data-range="week">近 7 天</button>
      <button class="date-tab" data-range="all">全部</button>
    </div>
    <input type="search" id="searchInput" class="search-input" placeholder="搜索标题或摘要…" aria-label="关键词搜索">
    <div class="source-chips" id="sourceChips" aria-label="来源筛选"></div>
    <button class="clear-btn" id="clearBtn" hidden>清除条件</button>
  </div>
</header>

<main>
  <section id="feedView" class="feed-view">
    <div id="digestCard" class="digest" hidden></div>
    <div id="feedList" class="feed-list" aria-live="polite"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-title">没有匹配的资讯</p>
      <p class="empty-desc">试试更换关键词、来源或时间范围。</p>
      <button class="clear-btn" id="emptyClearBtn">清除全部条件</button>
    </div>
  </section>

  <section id="graphView" class="graph-view" hidden>
    <svg id="graphSvg" role="img" aria-label="新闻与关键词关系图谱"></svg>
    <div id="graphNotice" class="graph-notice" hidden></div>
    <div class="graph-legend">
      <span><i class="lg lg-news"></i>新闻（越亮越新）</span>
      <span><i class="lg lg-kw"></i>关键词（越大越热）</span>
      <span class="legend-hint">拖拽移动 · 滚轮缩放 · 悬停看关联 · 点击看详情</span>
    </div>
  </section>

  <section id="askView" class="ask-view" hidden>
    <div class="ask-container">
      <div class="ask-header">
        <h2 class="ask-title">AI 智能问答</h2>
        <p class="ask-subtitle">基于近期 AI 资讯的语义检索与智能回答</p>
      </div>
      <div class="ask-input-wrap">
        <input type="text" id="askInput" class="ask-input" placeholder="输入你的问题，例如：OpenAI 最近有什么进展？" aria-label="提问输入">
        <button id="askBtn" class="ask-btn">提问</button>
      </div>
      <div id="askResult" class="ask-result" hidden>
        <div id="askLoading" class="ask-loading" hidden>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line"></div>
        </div>
        <div id="askAnswer" class="ask-answer" hidden></div>
        <div id="askCitations" class="ask-citations" hidden>
          <h3 class="citations-title">引用来源</h3>
          <div id="citationsList" class="citations-list"></div>
        </div>
      </div>
      <div id="askError" class="ask-error" hidden></div>
      <p id="askQuota" class="ask-quota" hidden></p>
    </div>
  </section>
</main>

<aside id="drawer" class="drawer" hidden aria-label="详情面板">
  <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
  <div id="drawerContent"></div>
</aside>

<footer class="site-footer">
  <div id="sourceStatus" class="source-status"></div>
  <p id="memoryNote" class="footer-note" hidden></p>
  <p id="costNote" class="footer-note cost-note" hidden></p>
  <p class="footer-note">
    发布时间以信息源原始时间为准（展示时区：Asia/Shanghai）；缺失时标注「发布时间未知」并展示采集时间。
    摘要为来源提供或页面截取，本站不生成内容。数据来源见 README。
  </p>
</footer>

<div id="loading" class="loading-overlay">数据载入中…</div>
<div id="loadError" class="loading-overlay" hidden>
  数据加载失败，请稍后刷新重试。<br><small id="loadErrorDetail"></small>
</div>

<script src="config.js"></script>
<script>
  // API 基地址：仅供 AI 问答（ask.js）调用 /ask 端点。
  // 真实地址来自 config.js（fetch.py 构建时从 AI_API_BASE 注入，线上指向部署好的 API）；
  // 未配置时回落到本机 8000 端口，本地开发照常可用。
  //
  // 注意：首页资讯流/图谱刻意不走 API —— 图谱与记忆策略由 fetch.py 离线算好写进 data.json，
  // API 的 /news 响应不含这些字段，混用会出现「空图谱 + 误导性提示」。
  if (!window.AI_API_BASE) window.AI_API_BASE = "http://localhost:8000";
</script>
<script src="vendor/d3.v7.min.js"></script>
<script src="app.js"></script>
<script src="graph.js"></script>
<script src="ask.js"></script>
</body>
</html>
